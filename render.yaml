services:
  - type: web
    name: thrice-autochess-lobby-test
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: thrice-test-profile-ids
          property: connectionString

databases:
  - name: thrice-test-profile-ids
    plan: free
    region: frankfurt